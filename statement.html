<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Customer Statement - GDA Finance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
    body { background:#F8FAFF; min-height:100vh; padding-bottom:85px; }
    .app-header {
      background:linear-gradient(135deg,#2A1742 0%,#3A1C62 50%,#4C2A7A 100%);
      padding:18px 16px 20px; border-radius:0 0 26px 26px;
      display:flex; justify-content:space-between; align-items:center;
      position:sticky; top:0; z-index:20;
    }
    .gda-logo-container{display:flex;align-items:center;gap:13px;}
    .gda-logo-icon{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#E91E63,#FF5A8A);display:flex;justify-content:center;align-items:center;border:2px solid rgba(255,255,255,0.3);}
    .gda-logo-icon .material-symbols-outlined{font-size:28px;color:#fff;font-variation-settings:'FILL'1;}
    .gda-logo-text h1{margin:0;font-size:27px;font-weight:800;color:#fff;}
    .gda-logo-text p{margin-top:3px;font-size:10.5px;font-weight:700;letter-spacing:3.2px;color:#FFC107;text-transform:uppercase;}
    .back-btn{background:rgba(255,255,255,0.14);color:#fff;padding:9px 14px;border-radius:12px;text-decoration:none;font-size:12px;border:1px solid rgba(255,255,255,0.18);}

    .container{padding:14px;max-width:600px;margin:0 auto;}
    .profile-card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,0.04);margin-bottom:16px;border:1px solid #F1F5F9;}
    .profile-top{display:flex;gap:14px;align-items:center;margin-bottom:14px;}
    .profile-top img{width:70px;height:70px;border-radius:50%;object-fit:cover;background:#F1F5F9;border:2px solid #E9D5FF;}
    .profile-top h2{font-size:20px;font-weight:800;color:#0F172A;}
    .profile-top p{font-size:13px;color:#64748B;font-weight:600;}
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;}
    .info-item{background:#F8FAFF;padding:10px;border-radius:12px;}
    .info-item .label{font-size:10px;font-weight:700;color:#94A3B8;text-transform:uppercase;}
    .info-item .value{font-size:16px;font-weight:800;color:#0F172A;margin-top:2px;}
    
    .kyc-section{background:#FFFBEB;border:1px solid #FDE68A;border-radius:16px;padding:14px;margin:12px 0;}
    .kyc-section h4{font-size:12px;color:#92400E;font-weight:800;margin-bottom:8px;}
    .kyc-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #FDE68A;font-size:13px;}
    .kyc-row:last-child{border:none;}

    /* ===== DOCUMENTS SECTION (NEW) ===== */
    .doc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .doc-item {
      text-align: center;
      background: #fff;
      border-radius: 12px;
      padding: 8px;
      border: 1px solid #E2E8F0;
    }
    .doc-item p {
      font-size: 9px;
      font-weight: 700;
      color: #64748B;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .doc-item img {
      width: 100%;
      max-height: 90px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #F1F5F9;
      background: #F8FAFF;
    }
    .doc-item .no-doc {
      font-size: 10px;
      color: #94A3B8;
      padding: 10px 0;
      font-weight: 600;
    }

    .action-bar{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:14px 0;}
    .action-btn{padding:10px;border-radius:12px;border:none;font-weight:800;font-size:11px;cursor:pointer;text-align:center;text-decoration:none;background:#F1F5F9;color:#0F172A;}
    .action-btn.whatsapp{background:#ECFDF5;color:#059669;border:1px solid #D1FAE5;}
    .action-btn.pdf{background:#FFF1F2;color:#DC2626;border:1px solid #FFE4E6;}
    .action-btn.bond{background:#FFFBEB;color:#92400E;border:1px solid #FEF3C7;}
    .action-btn.settle{background:#0F172A;color:#fff;}
    .action-btn.settle.settled{background:#E2E8F0;color:#94A3B8;}

    .table-wrap{background:#fff;border-radius:20px;border:1px solid #F1F5F9;overflow:hidden;}
    .table-wrap h3{padding:14px 16px;background:#F8FAFF;font-size:13px;font-weight:800;color:#0F172A;border-bottom:1px solid #F1F5F9;}
    table{width:100%;border-collapse:collapse;font-size:12px;}
    th{background:#F8FAFF;padding:10px 12px;text-align:left;font-weight:700;color:#64748B;text-transform:uppercase;font-size:10px;}
    td{padding:10px 12px;border-bottom:1px solid #F1F5F9;}
    .del-btn{background:#FFF1F2;color:#E11D48;border:1px solid #FFE4E6;padding:4px 10px;border-radius:6px;font-weight:700;cursor:pointer;}

    .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#fff;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;border-top:1px solid #F3E8FF;z-index:100;}
    .nav-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#A8A0B5;font-size:10px;font-weight:600;gap:3px;}
    .nav-item.active{color:#E91E63;}
    .nav-item .material-symbols-outlined{font-size:24px;}
  </style>
</head>
<body>

<header class="app-header">
  <div class="gda-logo-container">
    <div class="gda-logo-icon"><span class="material-symbols-outlined">shield_with_heart</span></div>
    <div class="gda-logo-text"><h1>GDA</h1><p>Finance Services</p></div>
  </div>
  <a href="customer-list.html" class="back-btn">← Back</a>
</header>

<div class="container" id="mainContainer">
  <div id="loadingMsg" style="text-align:center;padding:40px;color:#94A3B8;">⏳ Loading KYC Data...</div>
  <div id="profileContent" style="display:none;"></div>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item"><span class="material-symbols-outlined">home</span>Home</a>
  <a href="customer-list.html" class="nav-item active"><span class="material-symbols-outlined">group</span>Customers</a>
  <a href="collection.html" class="nav-item"><span class="material-symbols-outlined">paid</span>Collect</a>
  <a href="report.html" class="nav-item"><span class="material-symbols-outlined">analytics</span>Reports</a>
  <a href="#" id="logoutBtn" class="nav-item" style="color:#DC2626;"><span class="material-symbols-outlined">logout</span>Logout</a>
</nav>

<script type="module" src="statement.js"></script>
</body>
</html>
