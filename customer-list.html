<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Customers - GDA Finance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Inter:wght@500;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EE; --paper-line:#E5DAC0;
    --card:#FFFFFF; --card-border:#EEE6D3;
    --ink:#221733; --muted:#8B7FA0;
    --plum:#3A1C62; --plum-deep:#2A1742;
    --gold:#C8892C; --gold-bg:#FBEED2;
    --success:#16A34A; --success-bg:#E9F9EF;
    --danger:#DC2626; --danger-bg:#FDECEC;
    --shadow:rgba(58,28,98,0.06);
  }
  [data-theme="dark"]{
    --paper:#15101F; --paper-line:#382C50;
    --card:#201934; --card-border:#362A4E;
    --ink:#F3EDFF; --muted:#A99DC6;
    --gold:#F0BF5C; --gold-bg:#3A2E14;
    --success-bg:#12301F; --danger-bg:#3A1518;
    --shadow:rgba(0,0,0,0.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:var(--paper);padding-bottom:85px;transition:background .25s;}

  .app-header{
    background: linear-gradient(150deg,var(--plum-deep) 0%,var(--plum) 55%,#4C2A7A 100%);
    padding:18px 16px 20px;border-radius:0 0 28px 28px;
    display:flex;justify-content:space-between;align-items:center;
    box-shadow:0 14px 34px rgba(42,23,66,0.32);position:sticky;top:0;z-index:20;
  }
  .gda-logo-container{display:flex;align-items:center;gap:12px}
  .gda-logo-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#E91E63,#FF6F91);display:flex;justify-content:center;align-items:center;border:2px solid rgba(255,255,255,0.28)}
  .gda-logo-icon .material-symbols-outlined{font-size:25px;color:#fff;font-variation-settings:'FILL' 1;}
  .gda-logo-text h1{font-family:'Fraunces',serif;font-size:23px;font-weight:800;color:#fff;line-height:1;}
  .gda-logo-text p{font-size:9.5px;font-weight:700;letter-spacing:2.6px;color:#F0BF5C;text-transform:uppercase}
  .header-right{display:flex;align-items:center;gap:8px;}
  .back-btn{background:rgba(255,255,255,0.13);color:#fff;padding:8px 13px;border-radius:12px;text-decoration:none;font-size:12px;border:1px solid rgba(255,255,255,0.16)}
  #themeToggle{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.13);border:1px solid rgba(255,255,255,0.16);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;}
  #themeToggle .material-symbols-outlined{font-size:18px;}

  .container{padding:14px;max-width:600px;margin:0 auto}

  .filterTabs{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:14px;margin-bottom:12px;border:1px solid var(--card-border);box-shadow:0 5px 14px var(--shadow);}
  .filter-tab{flex:1;padding:10px;border-radius:10px;border:none;background:transparent;font-weight:700;color:var(--muted);cursor:pointer;font-size:12.5px}
  .filter-tab.active{background:var(--plum);color:#fff;}

  .searchWrap{position:relative;margin-bottom:14px}
  .searchWrap input{width:100%;padding:14px 14px 14px 42px;border-radius:14px;border:1.5px solid var(--card-border);background:var(--card);color:var(--ink);outline:none;font-size:14px}
  .searchWrap input:focus{border-color:var(--plum);box-shadow:0 0 0 4px rgba(58,28,98,0.08)}
  .searchWrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}

  /* Bottom Nav */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:66px;background:var(--card);backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;border-top:1px solid var(--card-border);z-index:100}
  .nav-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--muted);font-size:9.5px;font-weight:600;gap:3px}
  .nav-item.active{color:#E91E63;font-weight:700}
  .nav-item .material-symbols-outlined{font-size:22px}

  /* ===== BOND PAPER DRAWER (bottom sheet) ===== */
  #drawerOverlay{position:fixed;inset:0;background:rgba(20,12,32,0.6);z-index:200;display:none;opacity:0;transition:opacity 0.25s;}
  #drawerOverlay.active{opacity:1;}
  #drawer{
    position:fixed;left:0;right:0;bottom:0;max-height:82vh;overflow-y:auto;
    background:var(--card);border-radius:26px 26px 0 0;z-index:201;
    transform:translateY(100%);transition:transform 0.28s ease;
    padding:18px 16px 24px; box-shadow:0 -12px 40px rgba(0,0,0,0.2);
    border-top:1px solid var(--card-border);
  }
  .drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .drawer-head h3{font-family:'Fraunces',serif;font-size:17px;font-weight:800;color:var(--ink);}
  .drawer-head button{background:var(--paper);border:1px solid var(--card-border);color:var(--ink);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;}
  #bondPaper{background:var(--gold-bg);border:1px dashed var(--gold);border-radius:16px;padding:14px;margin-bottom:14px;}
  #historyList{background:var(--paper);border:1px solid var(--card-border);border-radius:16px;padding:12px 14px;margin-bottom:16px;max-height:180px;overflow-y:auto;}
  .drawer-actions{display:flex;gap:10px;}
  .drawer-actions button, .drawer-actions a{flex:1;padding:12px;border-radius:12px;border:none;font-weight:800;font-size:13px;text-align:center;cursor:pointer;text-decoration:none;}
  #btnWhatsapp{background:#25D366;color:#fff;}
  #btnPdf{background:var(--plum);color:#fff;}

  /* ===== CUSTOMER LEDGER CARD ===== */
  .cust-card{
    background:var(--card);border:1px solid var(--card-border);border-radius:20px;
    padding:14px;margin-bottom:10px;box-shadow:0 5px 16px var(--shadow);cursor:pointer;
    display:flex;flex-direction:column;gap:10px;
  }
  .cust-top{display:flex;gap:12px;align-items:center;}
  .cust-top img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);}
  .cust-name{font-family:'Fraunces',serif;font-size:15px;font-weight:800;color:var(--ink);}
  .cust-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .due-badge{
    display:inline-flex;align-items:center;gap:4px;margin-top:5px;
    font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;
    background:var(--danger-bg);color:var(--danger);
  }
  .due-badge.ok{background:var(--success-bg);color:var(--success);}
  .cust-actions{display:flex;gap:6px;width:100%;}
  .cust-actions a, .cust-actions button{
    flex:1;padding:9px;border-radius:10px;font-size:11.5px;font-weight:800;
    text-align:center;text-decoration:none;border:none;cursor:pointer;
  }
  .btn-collect{background:var(--plum);color:#fff;}
  .btn-del{background:var(--danger-bg);color:var(--danger);border:1px solid var(--card-border) !important;}
  .btn-edit{background:var(--gold-bg);color:var(--gold);border:1px solid var(--card-border) !important;}
</style>
</head>
<body>

<header class="app-header">
  <div class="gda-logo-container">
    <div class="gda-logo-icon"><span class="material-symbols-outlined">shield_with_heart</span></div>
    <div class="gda-logo-text"><h1>GDA</h1><p>Finance Services</p></div>
  </div>
  <div class="header-right">
    <button id="themeToggle" aria-label="Toggle dark mode"><span class="material-symbols-outlined" id="themeIcon">dark_mode</span></button>
    <a href="index.html" class="back-btn">← Back</a>
  </div>
</header>

<div class="container">
  <div class="filterTabs">
    <button class="filter-tab active" id="btnActive">Active Accounts</button>
    <button class="filter-tab" id="btnClosed">Closed Accounts</button>
  </div>

  <div class="searchWrap">
    <span class="material-symbols-outlined icon">search</span>
    <input id="searchInp" placeholder="Search name, mobile, code...">
  </div>

  <div id="listContainer"><p style="text-align:center;padding:20px;color:var(--muted);">⏳ Loading...</p></div>
</div>

<!-- ===== BOND PAPER DRAWER (customer card tap करने पर खुलता है) ===== -->
<div id="drawerOverlay"></div>
<div id="drawer">
  <div class="drawer-head">
    <h3 id="drawerName">Customer</h3>
    <button id="closeDrawer">✕</button>
  </div>
  <div id="bondPaper"></div>
  <div id="historyList"></div>
  <div class="drawer-actions">
    <button id="btnWhatsapp">💬 WhatsApp</button>
    <button id="btnPdf">📄 PDF</button>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item"><span class="material-symbols-outlined">home</span>Home</a>
  <a href="customer-list.html" class="nav-item active"><span class="material-symbols-outlined">group</span>Customers</a>
  <a href="collection.html" class="nav-item"><span class="material-symbols-outlined">paid</span>Collect</a>
  <a href="report.html" class="nav-item"><span class="material-symbols-outlined">analytics</span>Reports</a>
  <a href="#" id="logoutBtn" class="nav-item" style="color:#DC2626;"><span class="material-symbols-outlined">logout</span>Logout</a>
</nav>

<!-- 🌙 DARK MODE TOGGLE -->
<script>
  (function () {
    const root = document.documentElement;
    const toggleBtn = document.getElementById('themeToggle');
    const icon = document.getElementById('themeIcon');
    const saved = localStorage.getItem('gdaTheme');

    function applyTheme(theme) {
      if (theme === 'dark') {
        root.setAttribute('data-theme', 'dark');
        icon.innerText = 'light_mode';
      } else {
        root.removeAttribute('data-theme');
        icon.innerText = 'dark_mode';
      }
    }
    applyTheme(saved || 'light');

    toggleBtn.addEventListener('click', () => {
      const isDark = root.getAttribute('data-theme') === 'dark';
      const next = isDark ? 'light' : 'dark';
      applyTheme(next);
      localStorage.setItem('gdaTheme', next);
    });
  })();
</script>

<script type="module" src="customer-list.js"></script>
</body>
</html>
