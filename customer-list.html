<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Customers - GDA Finance</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--primary:#3A1C62;--pink:#E91E63;--gold:#FFC107;--bg:#F8FAFF;--card:#fff;--muted:#64748B;--line:#F1F5F9;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);min-height:100vh;padding-bottom:85px;}
.app-header{background:linear-gradient(135deg,#2A1742 0%,#3A1C62 50%,#4C2A7A 100%);padding:18px 16px 20px;border-radius:0 0 26px 26px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;}
.gda-logo-container{display:flex;align-items:center;gap:13px;}
.gda-logo-icon{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#E91E63,#FF5A8A);display:flex;justify-content:center;align-items:center;border:2px solid rgba(255,255,255,0.3);}
.gda-logo-icon .material-symbols-outlined{font-size:28px;color:#fff;font-variation-settings:'FILL' 1;}
.gda-logo-text h1{margin:0;font-size:27px;font-weight:800;color:#fff;}
.gda-logo-text p{margin-top:3px;font-size:10.5px;font-weight:700;letter-spacing:3.2px;color:var(--gold);text-transform:uppercase;}
.container{padding:14px;max-width:600px;margin:0 auto;}
.filterTabs{display:flex;gap:8px;margin-bottom:12px;}
.tabBtn{padding:11px 18px;border-radius:30px;border:1.5px solid #E2E8F0;background:#fff;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;}
.tabBtn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.searchWrap{position:relative;margin-bottom:14px;}
.searchWrap input{width:100%;padding:14px 14px 14px 42px;border-radius:14px;border:1.5px solid #E9D5FF;background:#fff;font-size:13px;font-weight:600;outline:none;}
.searchWrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);}
.custCard{background:#fff;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,0.04);border:1px solid #F1F5F9;margin-bottom:10px;}
.custCardTop{display:flex;gap:12px;align-items:center;cursor:pointer;}
.custCardTop img{width:56px;height:56px;border-radius:16px;object-fit:cover;background:#F1F5F9;}
.custInfo{flex:1;min-width:0;}
.custInfo h3{font-size:15px;font-weight:800;color:#0F172A;}
.custInfo p{font-size:12px;color:var(--muted);margin-top:2px;}
.actions{display:flex;gap:6px;}
.btn{padding:9px 14px;border-radius:12px;font-size:12px;font-weight:700;border:none;cursor:pointer;text-decoration:none;text-align:center;flex:1;}
.btnCollect{background:#0F172A;color:#fff;} .btnDel{background:#FFF1F2;color:#E11D48;border:1px solid #FFE4E6;} .btnEdit{background:#FFFBEB;color:#92400E;border:1px solid #FEF3C7;}

/* DRAWER */
#drawerOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(4px);z-index:100;display:none;}
#drawerOverlay.active{display:block;}
#drawer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:28px 28px 0 0;z-index:101;max-height:90vh;overflow-y:auto;transform:translateY(100%);transition:0.3s cubic-bezier(0.4,0,0.2,1);}
#drawer.active{transform:translateY(0);}
.bondPaper{background:linear-gradient(135deg,#FFFBEB,#FFF7ED);border:1.5px solid #FDE68A;border-radius:16px;padding:16px;margin-bottom:14px;}
.bondRow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #FDE68A;font-size:12px;}
.drawerBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.dBtn{padding:13px;border-radius:12px;border:none;font-size:13px;font-weight:700;cursor:pointer;display:flex;justify-content:center;text-decoration:none;}
.dBtn.whatsapp{background:#25D366;color:#fff;} .dBtn.pdf{background:#DC2626;color:#fff;} .dBtn.call{background:#0F172A;color:#fff;} .dBtn.close{background:#F1F5F9;color:var(--muted);}
.historyBox{background:#F8FAFF;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:180px;overflow-y:auto;}
.hItem{display:flex;justify-content:space-between;padding:6px 0;font-size:11px;border-bottom:1px solid #F1F5F9;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:rgba(255,255,255,0.96);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;border-top:1px solid #F3E8FF;z-index:90;}
.nav-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#A8A0B5;font-size:10px;font-weight:600;gap:3px;}
.nav-item.active{color:var(--pink);font-weight:700;}
.nav-item .material-symbols-outlined{font-size:24px;}
</style>
</head>
<body>

<header class="app-header">
  <div class="gda-logo-container"><div class="gda-logo-icon"><span class="material-symbols-outlined">shield_with_heart</span></div><div class="gda-logo-text"><h1>GDA</h1><p>Finance Services</p></div></div>
  <a href="index.html" style="background:rgba(255,255,255,0.14);color:#fff;padding:9px 14px;border-radius:12px;text-decoration:none;font-size:12px;">← Back</a>
</header>

<div class="container">
  <div class="filterTabs"><button class="tabBtn active" id="btnActive">Active Accounts</button><button class="tabBtn" id="btnClosed">Closed Accounts</button></div>
  <div class="searchWrap"><span class="material-symbols-outlined icon" style="font-size:18px;">search</span><input type="text" id="searchInp" placeholder="Search name, mobile, code..."></div>
  <div id="listContainer"><p style="text-align:center;padding:30px;color:#94A3B8;">⏳ Loading...</p></div>
</div>

<!-- BOND PAPER DRAWER -->
<div id="drawerOverlay"></div>
<div id="drawer">
  <div style="width:40px;height:4px;background:#E2E8F0;border-radius:10px;margin:10px auto;"></div>
  <div style="padding:0 20px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #F1F5F9;">
    <h3 id="drawerName" style="font-size:16px;font-weight:800;">Customer Details</h3>
    <button id="closeDrawer" style="border:none;background:#F1F5F9;width:32px;height:32px;border-radius:50%;cursor:pointer;">✕</button>
  </div>
  <div style="padding:16px;">
    <div class="bondPaper" id="bondPaper"></div>
    <div class="drawerBtns">
      <a href="#" id="btnWhatsapp" class="dBtn whatsapp">WhatsApp PDF</a>
      <a href="#" id="btnPdf" class="dBtn pdf">PDF Download</a>
      <a href="#" id="btnCall" class="dBtn call">📞 Call</a>
      <button id="btnClose2" class="dBtn close">Close</button>
    </div>
    <div class="historyBox" id="historyList"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item"><span class="material-symbols-outlined">home</span>Home</a>
  <a href="customer-list.html" class="nav-item active"><span class="material-symbols-outlined">group</span>Customers</a>
  <a href="collection.html" class="nav-item"><span class="material-symbols-outlined">paid</span>Collect</a>
  <a href="report.html" class="nav-item"><span class="material-symbols-outlined">analytics</span>Reports</a>
  <a href="#" id="logoutBtn" class="nav-item" style="color:#DC2626;"><span class="material-symbols-outlined">logout</span>Logout</a>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
import { db, auth } from "./firebase.js";
import { collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const listContainer = document.getElementById("listContainer");
const searchInp = document.getElementById("searchInp");
const ADMIN_PASSWORD = "GDA@2026";
let allCustomers=[], allCollections=[], selectedCustomer=null;
const drawer=document.getElementById("drawer"), drawerOverlay=document.getElementById("drawerOverlay");

async function loadCustomers(){
  listContainer.innerHTML="<p style='text-align:center;padding:20px;'>⏳ लोड हो रहा है...</p>";
  try{
    const [custSnap, colSnap]=await Promise.all([getDocs(collection(db,"customers")), getDocs(collection(db,"collections"))]);
    allCustomers=custSnap.docs.map(d=>({id:d.id,...d.data()}));
    allCollections=colSnap.docs.map(d=>d.data());
    renderList(allCustomers.filter(c=>c.status!=="Closed"));
  }catch(e){ listContainer.innerHTML="❌ Error: "+e.message; }
}

function renderList(data){
  if(data.length===0){ listContainer.innerHTML="<p style='text-align:center;padding:20px;'>कोई कस्टमर नहीं मिला।</p>"; return; }
  listContainer.innerHTML="";
  data.forEach(cust=>{
    const div=document.createElement("div");
    div.className="custCard";
    const imgUrl=(cust.photoUrl&&cust.photoUrl.startsWith('http'))?cust.photoUrl:'https://via.placeholder.com/55';
    div.innerHTML=`
      <div class="custCardTop">
        <img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/55'">
        <div class="custInfo"><h3>${cust.name||"N/A"}</h3><p>📱 ${cust.mobile||"N/A"}</p><p>💰 लोन: ₹${cust.loanAmount||0} | ${cust.customerCode||''}</p></div>
      </div>
      <div class="actions">
        <a href="collection.html?id=${cust.id}" class="btn btnCollect">Collect</a>
        <button class="btn btnDel" data-del="${cust.id}">Del</button>
        <button class="btn btnEdit" data-edit="${cust.id}">Edit</button>
      </div>`;
    // CLICK ON TOP = OPEN DRAWER
    div.querySelector(".custCardTop").onclick=()=>openDrawer(cust);
    // Buttons
    div.querySelector("[data-del]").onclick=(e)=>{e.stopPropagation(); secureDelete(cust.id);};
    div.querySelector("[data-edit]").onclick=(e)=>{e.stopPropagation(); secureEdit(cust.id);};
    listContainer.appendChild(div);
  });
}

function openDrawer(cust){
  selectedCustomer=cust;
  const remain=Math.max(0, Number(cust.loanAmount||0)*1.2 - Number(cust.totalCollected||0));
  document.getElementById("drawerName").innerText=cust.name;
  document.getElementById("bondPaper").innerHTML=`
    <h4 style="text-align:center;font-weight:800;color:#92400E;margin-bottom:10px;">📄 GDA FINANCE - BOND PAPER</h4>
    <div class="bondRow"><span>Name:</span><b>${cust.name}</b></div>
    <div class="bondRow"><span>Code:</span><b>${cust.customerCode||'GDA'}</b></div>
    <div class="bondRow"><span>Mobile:</span><b>${cust.mobile||''}</b></div>
    <div class="bondRow"><span>Loan:</span><b>₹${cust.loanAmount||0}</b></div>
    <div class="bondRow"><span>EMI:</span><b>₹${cust.dailyEmi||cust.emi||0}</b></div>
    <div class="bondRow"><span>Paid:</span><b>₹${cust.totalCollected||0}</b></div>
    <div class="bondRow" style="border:none;"><span>Remaining:</span><b style="color:#DC2626;">₹${remain.toLocaleString('en-IN')}</b></div>`;
  const hist=allCollections.filter(x=>x.customerId===cust.id).sort((a,b)=>new Date(b.date||b.collectionDate)-new Date(a.date||a.collectionDate)).slice(0,20);
  document.getElementById("historyList").innerHTML= hist.length? `<h5 style="font-size:11px;color:#64748B;margin-bottom:8px;">📊 Collection History</h5>`+hist.map(h=>`<div class="hItem"><span>${h.date||h.collectionDate}</span><b>₹${h.amount||h.collectionAmount||0}</b></div>`).join('') : '<p style="font-size:12px;color:#94A3B8;">No collection yet</p>';
  document.getElementById("btnCall").href=`tel:${cust.mobile}`;
  drawer.classList.add("active"); drawerOverlay.classList.add("active"); drawerOverlay.style.display="block";
}
function closeDrawer(){ drawer.classList.remove("active"); drawerOverlay.classList.remove("active"); setTimeout(()=>drawerOverlay.style.display="none",300); }
document.getElementById("closeDrawer").onclick=closeDrawer;
document.getElementById("btnClose2").onclick=closeDrawer;
document.getElementById("drawerOverlay").onclick=closeDrawer;

document.getElementById("btnWhatsapp").onclick=(e)=>{
  e.preventDefault();
  const msg=`*GDA Finance Services*%0A%0ABond Paper%0AName: ${selectedCustomer.name}%0ACode: ${selectedCustomer.customerCode}%0ALoan: ₹${selectedCustomer.loanAmount}%0AEMI: ₹${selectedCustomer.dailyEmi||selectedCustomer.emi}%0APaid: ₹${selectedCustomer.totalCollected||0}%0ABranch: Garhwa`;
  window.open(`https://wa.me/91${selectedCustomer.mobile}?text=${msg}`,'_blank');
};
document.getElementById("btnPdf").onclick=(e)=>{
  e.preventDefault();
  const {jsPDF}=window.jspdf; const pdf=new jsPDF();
  pdf.text("GDA FINANCE - BOND PAPER",20,20);
  pdf.text(`Name: ${selectedCustomer.name}`,20,35);
  pdf.text(`Code: ${selectedCustomer.customerCode||''}`,20,45);
  pdf.text(`Mobile: ${selectedCustomer.mobile||''}`,20,55);
  pdf.text(`Loan: ${selectedCustomer.loanAmount||0}`,20,65);
  pdf.text(`EMI: ${selectedCustomer.dailyEmi||selectedCustomer.emi||0}`,20,75);
  pdf.text(`Paid: ${selectedCustomer.totalCollected||0}`,20,85);
  pdf.save(`${selectedCustomer.name}_Bond.pdf`);
};

function secureEdit(id){ const p=prompt("🔑 Admin Password:"); if(p===ADMIN_PASSWORD) location.href=`edit-customer.html?id=${id}`; else if(p!==null) alert("❌ गलत पासवर्ड!"); }
async function secureDelete(id){ const p=prompt("⚠️ DELETE Password:"); if(p!==ADMIN_PASSWORD){ if(p!==null) alert("❌ गलत पासवर्ड!"); return; } if(!confirm("Delete karna hai?")) return; try{ await deleteDoc(doc(db,"customers",id)); alert("✅ Deleted!"); loadCustomers(); }catch(e){ alert(e.message); } }

let currentMode="Active";
document.getElementById("btnActive").onclick=function(){ currentMode="Active"; this.classList.add("active"); document.getElementById("btnClosed").classList.remove("active"); renderList(allCustomers.filter(c=>c.status!=="Closed")); };
document.getElementById("btnClosed").onclick=function(){ currentMode="Closed"; this.classList.add("active"); document.getElementById("btnActive").classList.remove("active"); renderList(allCustomers.filter(c=>c.status==="Closed")); };
searchInp.addEventListener("input", e=>{
  const term=e.target.value.toLowerCase();
  const base=currentMode==="Active"? allCustomers.filter(c=>c.status!=="Closed") : allCustomers.filter(c=>c.status==="Closed");
  renderList(base.filter(c=>(c.name&&c.name.toLowerCase().includes(term))||(c.mobile&&c.mobile.includes(term))));
});

onAuthStateChanged(auth, user=>{ if(!user) location.href="login.html"; else loadCustomers(); });
document.getElementById("logoutBtn").onclick=async(e)=>{ e.preventDefault(); await signOut(auth); location.href="login.html"; };
</script>
</body>
</html>
