<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Customers - GDA Finance</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#F8FAFF;padding-bottom:85px;}
.topbar{position:sticky;top:0;z-index:10;background:rgba(248,250,255,0.9);backdrop-filter:blur(20px);padding:14px;border-bottom:1px solid #F1F5F9;}
.tabs{display:flex;gap:8px;margin-bottom:10px;}
.tab{padding:10px 18px;border-radius:30px;font-size:13px;font-weight:700;border:1px solid #E2E8F0;background:#fff;color:#475569;}
.tab.active{background:#0F172A;color:#fff;border-color:#0F172A;}
.searchWrap{position:relative;}
.searchWrap input{width:100%;background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:12px 14px 12px 40px;font-size:14px;outline:none;}
.searchWrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94A3B8;}

.list{padding:12px;display:flex;flex-direction:column;gap:10px;}
.cust-card{background:#fff;border-radius:18px;padding:12px;border:1px solid #F1F5F9;box-shadow:0 4px 16px rgba(0,0,0,0.04);display:flex;gap:12px;align-items:center;cursor:pointer;}
.cust-card:active{transform:scale(0.98);}
.avatar{width:52px;height:52px;border-radius:14px;object-fit:cover;flex-shrink:0;background:#EFF6FF;}
.info{flex:1;min-width:0;}
.name{font-size:14px;font-weight:800;color:#0F172A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.meta{font-size:11px;color:#64748B;margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.badge{background:#F1F5F9;border:1px solid #E2E8F0;color:#475569;font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;}
.actions{display:flex;gap:6px;flex-shrink:0;}
.btn{border:none;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;}
.btn-collect{background:#0F172A;color:#fff;}
.btn-del{background:#FFF1F2;color:#DC2626;border:1px solid #FECDD3;}
.btn-edit{background:#FFFBEB;color:#92400E;border:1px solid #FDE68A;}

/* DETAIL MODAL - Purana wala wapas */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;z-index:100;align-items:end;justify-content:center;}
.modal.active{display:flex;}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;max-height:85vh;overflow:auto;padding:18px;animation:slideUp 0.3s;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheetHeader{display:flex;gap:14px;align-items:center;padding-bottom:14px;border-bottom:1px solid #F1F5F9;}
.sheetAvatar{width:64px;height:64px;border-radius:18px;object-fit:cover;}
.sheetName{font-size:18px;font-weight:800;color:#0F172A;}
.sheetCode{font-size:11px;color:#64748B;margin-top:2px;}
.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.detailItem{background:#F8FAFF;border:1px solid #F1F5F9;border-radius:12px;padding:10px;}
.detailItem label{font-size:9px;color:#94A3B8;font-weight:700;text-transform:uppercase;display:block;}
.detailItem b{font-size:13px;color:#0F172A;margin-top:3px;display:block;}
.actionRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.actionBtn{padding:12px;border-radius:14px;border:none;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;}
.btn-wa{background:#25D366;color:#fff;}
.btn-call{background:#EFF6FF;color:#1E3A8A;border:1px solid #DBEAFE;}
.btn-bond{background:#0F172A;color:#fff;}
.btn-close{background:#F1F5F9;color:#475569;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #F1F5F9;z-index:50;}
.bnav-item{display:flex;flex-direction:column;align-items:center;color:#94A3B8;font-size:9px;font-weight:600;text-decoration:none;gap:3px;}
.bnav-item.active{color:#E11D48;}
</style>
</head>
<body>

<div class="topbar">
  <div class="tabs">
    <button class="tab active" id="btnActive" onclick="setFilter('active')">Active Accounts</button>
    <button class="tab" id="btnClosed" onclick="setFilter('closed')">Closed Accounts</button>
  </div>
  <div class="searchWrap"><i>⌕</i><input id="searchInput" placeholder="Search name, mobile, code..." oninput="onSearch(this.value)"></div>
</div>

<div class="list" id="customerList"><div style="text-align:center;padding:30px;color:#94A3B8;">Loading...</div></div>

<!-- DETAIL SHEET - Pehle jaisa sab kuch -->
<div class="modal" id="detailModal" onclick="if(event.target==this)closeModal()">
  <div class="sheet">
    <div class="sheetHeader">
      <img id="mAvatar" class="sheetAvatar" src="">
      <div>
        <div class="sheetName" id="mName"></div>
        <div class="sheetCode" id="mCode"></div>
        <div class="sheetCode" id="mMobile"></div>
      </div>
    </div>
    <div class="detailGrid">
      <div class="detailItem"><label>Loan Amount</label><b id="mLoan"></b></div>
      <div class="detailItem"><label>Daily EMI</label><b id="mEmi"></b></div>
      <div class="detailItem"><label>Loan Date</label><b id="mDate"></b></div>
      <div class="detailItem"><label>Status</label><b id="mStatus"></b></div>
      <div class="detailItem" style="grid-column:1/3"><label>Address</label><b id="mAddress"></b></div>
      <div class="detailItem" style="grid-column:1/3"><label>Aadhar / Guarantor</label><b id="mAadhar"></b></div>
    </div>
    <div class="actionRow">
      <button class="actionBtn btn-wa" id="btnWhatsApp">WhatsApp</button>
      <button class="actionBtn btn-call" id="btnCall">Call</button>
      <button class="actionBtn btn-bond" id="btnBond">View Bond</button>
      <button class="actionBtn btn-close" onclick="closeModal()">Close</button>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;">
      <button class="actionBtn btn-close" style="flex:1" id="btnEditModal">Edit</button>
      <button class="actionBtn btn-del" style="flex:1;background:#FFF1F2;color:#DC2626;border:1px solid #FECDD3;" id="btnDelModal">Delete</button>
    </div>
  </div>
</div>

<div class="bottom-nav">
  <a class="bnav-item" href="index.html"><span>⌂</span><span>Home</span></a>
  <a class="bnav-item active"><span>◫</span><span>Customers</span></a>
  <a class="bnav-item" href="collection.html"><span>$</span><span>Collect</span></a>
  <a class="bnav-item" href="reports.html"><span>◱</span><span>Reports</span></a>
  <a class="bnav-item" href="#" id="logoutBtn"><span>↪</span><span>Logout</span></a>
</div>

<script type="module">
import { db, auth } from "./firebase.js";
import { collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

let allCustomers = [];
let currentFilter = 'active';
let searchQ = '';
let selectedId = null;

const listEl = document.getElementById("customerList");
const modal = document.getElementById("detailModal");

onAuthStateChanged(auth, u=>{ if(!u) location.href="login.html"; else loadCustomers(); });

async function loadCustomers(){
  const snap = await getDocs(collection(db,"customers"));
  allCustomers=[]; snap.forEach(d=>allCustomers.push({id:d.id,...d.data()}));
  render();
}

function render(){
  let filtered = allCustomers.filter(c=>{
    const status = (c.status||'Active');
    const match = currentFilter==='active' ? status!=='Closed' : status==='Closed';
    if(!match) return false;
    if(!searchQ) return true;
    const q=searchQ.toLowerCase();
    return (c.name||'').toLowerCase().includes(q) || (c.mobile||'').includes(q) || (c.customerCode||'').toLowerCase().includes(q);
  });

  if(filtered.length===0){ listEl.innerHTML=`<div style="text-align:center;padding:40px;color:#94A3B8;">No customers</div>`; return; }

  listEl.innerHTML = filtered.map(c=>{
    const photo = c.photoUrl || c.photo || `https://ui-avatars.com/api/?name=${encodeURIComponent(c.name||'C')}&background=0F172A&color=fff&bold=true`;
    const code = c.customerCode || c.customerId || c.id.substring(0,6).toUpperCase();
    const mobile = c.mobile || c.phone || '';
    const loan = c.loanAmount || 0;
    return `
    <div class="cust-card" onclick="openDetail('${c.id}')">
      <img class="avatar" src="${photo}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(c.name||'C')}&background=0F172A&color=fff'">
      <div class="info">
        <div class="name">${c.name||'No Name'}</div>
        <div class="meta"><span>${mobile}</span> <span class="badge">${code}</span></div>
        <div class="meta">Loan: <b>₹${Number(loan).toLocaleString('en-IN')}</b></div>
      </div>
      <div class="actions" onclick="event.stopPropagation()">
        <button class="btn btn-collect" onclick="collectCustomer('${c.id}')">Collect</button>
        <button class="btn btn-del" onclick="deleteCustomer('${c.id}')">Del</button>
        <button class="btn btn-edit" onclick="editCustomer('${c.id}')">Edit</button>
      </div>
    </div>`;
  }).join('');
}

window.openDetail = (id)=>{
  const c = allCustomers.find(x=>x.id===id);
  if(!c) return;
  selectedId = id;
  document.getElementById("mAvatar").src = c.photoUrl || c.photo || `https://ui-avatars.com/api/?name=${encodeURIComponent(c.name||'C')}&background=0F172A&color=fff&bold=true`;
  document.getElementById("mName").innerText = c.name||'';
  document.getElementById("mCode").innerText = `ID: ${c.customerCode || c.customerId || c.id}`;
  document.getElementById("mMobile").innerText = `📱 ${c.mobile || c.phone || ''}`;
  document.getElementById("mLoan").innerText = `₹${Number(c.loanAmount||0).toLocaleString('en-IN')}`;
  document.getElementById("mEmi").innerText = `₹${c.dailyEmi || c.emi || 0}`;
  document.getElementById("mDate").innerText = c.loanDate || c.createdAt || '-';
  document.getElementById("mStatus").innerText = c.status || 'Active';
  document.getElementById("mAddress").innerText = c.address || c.village || '-';
  document.getElementById("mAadhar").innerText = `Aadhar: ${c.aadhar||'-'} | Guarantor: ${c.guarantorName||'-'}`;

  // Buttons
  document.getElementById("btnWhatsApp").onclick = ()=>{
    const msg = `Namaste ${c.name}, Aapka GDA Finance ka EMI ₹${c.dailyEmi||0} pending hai. ID: ${c.customerCode||''}`;
    window.open(`https://wa.me/91${c.mobile}?text=${encodeURIComponent(msg)}`, '_blank');
  };
  document.getElementById("btnCall").onclick = ()=>{ window.open(`tel:${c.mobile}`); };
  document.getElementById("btnBond").onclick = ()=>{ location.href=`bond.html?id=${c.id}`; };
  document.getElementById("btnEditModal").onclick = ()=>{ location.href=`register.html?id=${c.id}`; };
  document.getElementById("btnDelModal").onclick = ()=>{ deleteCustomer(c.id); closeModal(); };

  modal.classList.add("active");
}
window.closeModal = ()=>{ modal.classList.remove("active"); }

window.setFilter = (f)=>{ currentFilter=f; document.getElementById("btnActive").classList.toggle('active',f==='active'); document.getElementById("btnClosed").classList.toggle('active',f==='closed'); render(); }
window.onSearch = (v)=>{ searchQ=v; render(); }
window.collectCustomer = (id)=>{ location.href=`collection.html?id=${id}`; }
window.editCustomer = (id)=>{ location.href=`register.html?id=${id}`; }
window.deleteCustomer = async (id)=>{
  if(!confirm("Delete this customer?")) return;
  await deleteDoc(doc(db,"customers",id));
  allCustomers = allCustomers.filter(c=>c.id!==id);
  render();
}
document.getElementById("logoutBtn").onclick = async()=>{ await signOut(auth); location.href="login.html"; }
</script>
</body>
</html>
