<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Customers - GDA Finance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
  :root{--primary:#3A1C62;--pink:#E91E63;--gold:#FFC107;--bg:#F8FAFF;--muted:#64748B;--line:#F1F5F9}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);padding-bottom:85px}

  .app-header{background:linear-gradient(135deg,#2A1742 0%,#3A1C62 50%,#4C2A7A 100%);padding:18px 16px 20px;border-radius:0 0 26px 26px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;box-shadow:0 12px 32px rgba(58,28,98,0.28)}
  .gda-logo-container{display:flex;align-items:center;gap:13px}
  .gda-logo-icon{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#E91E63,#FF5A8A);display:flex;justify-content:center;align-items:center;border:2px solid rgba(255,255,255,0.3)}
  .gda-logo-icon .material-symbols-outlined{font-size:28px;color:#fff}
  .gda-logo-text h1{margin:0;font-size:27px;font-weight:800;color:#fff}
  .gda-logo-text p{font-size:10.5px;font-weight:700;letter-spacing:3.2px;color:var(--gold);text-transform:uppercase}
  .back-btn{background:rgba(255,255,255,0.14);color:#fff;padding:9px 14px;border-radius:12px;text-decoration:none;font-size:12px;border:1px solid rgba(255,255,255,0.18)}

  .container{padding:14px;max-width:600px;margin:0 auto}

  .filterTabs{display:flex;gap:8px;margin-bottom:12px}
  .filter-tab{padding:11px 18px;border-radius:30px;border:1.5px solid #E2E8F0;background:#fff;font-weight:700;color:var(--muted);cursor:pointer;font-size:13px}
  .filter-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  .searchWrap{position:relative;margin-bottom:14px}
  .searchWrap input{width:100%;padding:14px 14px 14px 42px;border-radius:14px;border:1.5px solid #E9D5FF;background:#fff;outline:none;font-size:14px}
  .searchWrap input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(58,28,98,0.08)}
  .searchWrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}

  /* Bottom Nav */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:rgba(255,255,255,0.96);backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;border-top:1px solid #F3E8FF;z-index:100}
  .nav-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#A8A0B5;font-size:10px;font-weight:600;gap:3px}
  .nav-item.active{color:var(--pink);font-weight:700}
  .nav-item .material-symbols-outlined{font-size:24px}

  /* ===== BOND PAPER DRAWER (bottom sheet) ===== */
  #drawerOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:none;opacity:0;transition:opacity 0.25s;}
  #drawerOverlay.active{opacity:1;}
  #drawer{
    position:fixed;left:0;right:0;bottom:0;max-height:82vh;overflow-y:auto;
    background:#fff;border-radius:24px 24px 0 0;z-index:201;
    transform:translateY(100%);transition:transform 0.28s ease;
    padding:18px 16px 24px; box-shadow:0 -10px 40px rgba(0,0,0,0.15);
  }
  .drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .drawer-head h3{font-size:16px;font-weight:800;color:#0F172A;}
  .drawer-head button{background:#F1F5F9;border:none;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;}
  #bondPaper{background:#FFFBEB;border:1px solid #FDE68A;border-radius:14px;padding:14px;margin-bottom:14px;}
  #historyList{background:#F8FAFF;border-radius:14px;padding:12px 14px;margin-bottom:16px;max-height:180px;overflow-y:auto;}
  .drawer-actions{display:flex;gap:10px;}
  .drawer-actions button, .drawer-actions a{flex:1;padding:12px;border-radius:12px;border:none;font-weight:800;font-size:13px;text-align:center;cursor:pointer;text-decoration:none;}
  #btnWhatsapp{background:#25D366;color:#fff;}
  #btnPdf{background:var(--primary);color:#fff;}
</style>
</head>
<body>

<header class="app-header">
  <div class="gda-logo-container">
    <div class="gda-logo-icon"><span class="material-symbols-outlined">shield_with_heart</span></div>
    <div class="gda-logo-text"><h1>GDA</h1><p>Finance Services</p></div>
  </div>
  <a href="index.html" class="back-btn">← Back</a>
</header>

<div class="container">
  <div class="filterTabs">
    <button class="filter-tab active" id="btnActive">Active Accounts</button>
    <button class="filter-tab" id="btnClosed">Closed Accounts</button>
  </div>

  <div class="searchWrap">
    <span class="material-symbols-outlined icon">search</span>
    <input id="searchInp" placeholder="Search name, mobile, code...">
  </div>

  <div id="listContainer"><p style="text-align:center;padding:20px;color:#94A3B8;">⏳ Loading...</p></div>
</div>

<!-- ===== BOND PAPER DRAWER (customer card tap करने पर खुलता है) ===== -->
<div id="drawerOverlay"></div>
<div id="drawer">
  <div class="drawer-head">
    <h3 id="drawerName">Customer</h3>
    <button id="closeDrawer">✕</button>
  </div>
  <div id="bondPaper"></div>
  <div id="historyList"></div>
  <div class="drawer-actions">
    <button id="btnWhatsapp">💬 WhatsApp</button>
    <button id="btnPdf">📄 PDF</button>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item"><span class="material-symbols-outlined">home</span>Home</a>
  <a href="customer-list.html" class="nav-item active"><span class="material-symbols-outlined">group</span>Customers</a>
  <a href="collection.html" class="nav-item"><span class="material-symbols-outlined">paid</span>Collect</a>
  <a href="report.html" class="nav-item"><span class="material-symbols-outlined">analytics</span>Reports</a>
  <a href="#" id="logoutBtn" class="nav-item" style="color:#DC2626;"><span class="material-symbols-outlined">logout</span>Logout</a>
</nav>

<script type="module" src="customer-list.js"></script>
</body>
</html>
