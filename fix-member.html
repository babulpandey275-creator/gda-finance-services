<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Member IDs</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #fce4ec; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 20px; max-width: 500px; text-align: center; box-shadow: 0 4px 20px rgba(58, 28, 98, 0.15); border: 1px solid #f0e6f6; width:100%; }
        h1 { color: #3a1c62; font-size: 24px; margin-bottom: 10px; }
        p { color: #6d5b85; font-size: 14px; margin-bottom: 20px; }
        button { background: #3a1c62; color: white; border: none; padding: 14px 30px; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; width: 100%; }
        button:disabled{opacity:0.6}
        #log { background: #f8f0fc; border-radius: 10px; padding: 15px; margin-top: 20px; font-size: 13px; color: #3a1c62; text-align: left; max-height: 350px; overflow-y: auto; border: 1px solid #e1bee7; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔧 Fix Customer IDs</h1>
        <p>Ye script saare purane customers ko <strong>date ke hisab se GDA0001, GDA0002...</strong> me sahi karegi aur duplicate ID khatam karegi.</p>
        <button id="fixBtn">🚀 Start Fixing IDs</button>
        <div id="log">⏳ Taiyar hai...</div>
    </div>

<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs, updateDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const logEl = document.getElementById('log');
const fixBtn = document.getElementById('fixBtn');

function log(msg) {
    logEl.innerHTML += `<div>${msg}</div>`;
    logEl.scrollTop = logEl.scrollHeight;
}

fixBtn.onclick = async () => {
    fixBtn.disabled = true;
    fixBtn.innerText = "⏳ Processing...";
    logEl.innerHTML = "";

    try {
        log("📥 Saare customers load ho rahe hain...");
        const snapshot = await getDocs(collection(db, "customers"));
        let customers = [];
        snapshot.forEach(d => customers.push({ id: d.id, ...d.data() }));

        if (customers.length === 0) {
            log("❌ Koi customer nahi mila!");
            fixBtn.disabled = false; return;
        }
        log(`✅ ${customers.length} customer mile`);

        // 🔥 FIX: createdAt se sort - sabse purana pehle
        customers.sort((a, b) => {
            const dateA = new Date(a.createdAt || a.loanDate || 0);
            const dateB = new Date(b.createdAt || b.loanDate || 0);
            return dateA - dateB;
        });

        log("🔄 ID sahi ki ja rahi hain...");
        let count = 0;
        for (let i = 0; i < customers.length; i++) {
            const newCode = `GDA${String(i + 1).padStart(4, '0')}`;
            
            // Har customer ko naya code do, chahe duplicate ho ya na ho - taaki sequence 1,2,3 me aa jaye
            if (customers[i].customerCode !== newCode) {
                await updateDoc(doc(db, "customers", customers[i].id), {
                    member_id: newCode,
                    member_no: i + 1,
                    customerCode: newCode
                });
                log(`✅ ${customers[i].name || 'Customer'} → ${newCode}`);
                count++;
            }
        }

        // 🔥 FIX: Counter automatic update
        await setDoc(doc(db, "metadata", "customerCounter"), { lastNumber: customers.length }, { merge: true });

        log(`<br><b style="color:green;">🎉 Ho gaya! ${count} ID sahi hue.<br>Ab lastNumber = ${customers.length} set ho gaya hai. Ab aage se duplicate nahi banega.</b>`);
        fixBtn.innerText = "✅ Done!";

    } catch (err) {
        log(`<span style="color:red;">❌ Error: ${err.message}</span>`);
        console.error(err);
        fixBtn.disabled = false;
        fixBtn.innerText = "🚀 Start Fixing IDs";
    }
};
</script>
</body>
</html>
