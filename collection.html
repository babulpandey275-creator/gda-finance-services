<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GDA Finance - Daily Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--primary:#3A1C62;--pink:#E91E63;--gold:#FFC107;--bg:#FFF5F8;--card:#fff;--text:#3A1C62;--muted:#7A6B8A;--line:#F3E8FF;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);min-height:100vh;padding-bottom:85px;}

/* === INTERNATIONAL GDA HEADER === */
.app-header{
  background: linear-gradient(135deg,#2A1742 0%,#3A1C62 50%,#4C2A7A 100%);
  padding:18px 16px 20px;border-radius:0 0 26px 26px;
  display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 12px 32px rgba(58,28,98,0.28);position:sticky;top:0;z-index:20;
}
.gda-logo-container{display:flex;align-items:center;gap:13px;}
.gda-logo-icon{
  width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#E91E63,#FF5A8A);
  display:flex;justify-content:center;align-items:center;
  border:2px solid rgba(255,255,255,0.3);box-shadow:0 4px 14px rgba(233,30,99,0.35);
}
.gda-logo-icon .material-symbols-outlined{font-size:28px;color:#fff;font-variation-settings:'FILL' 1;}
.gda-logo-text h1{margin:0;font-size:27px;font-weight:800;line-height:1;color:#fff;letter-spacing:0.5px;}
.gda-logo-text p{margin-top:3px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:3.2px;color:var(--gold);}
.back-btn{background:rgba(255,255,255,0.14);backdrop-filter:blur(12px);color:#fff;border:1px solid rgba(255,255,255,0.18);padding:9px 14px;border-radius:12px;font-size:12px;font-weight:600;text-decoration:none;}

.container{padding:16px;max-width:600px;margin:0 auto;}
.form-card{
  background:var(--card);border-radius:24px;padding:20px;
  box-shadow:0 12px 40px rgba(58,28,98,0.09);border:1px solid #fff;
}
.form-card .title{font-size:19px;font-weight:800;color:var(--primary);margin-bottom:18px;display:flex;align-items:center;gap:8px;}

.form-group{margin-bottom:15px;}
.form-group label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;}
.form-group select, .form-group input{
  width:100%;padding:14px 14px;border-radius:14px;border:1.5px solid #E9D5FF;
  font-size:14px;font-weight:600;background:#FCF8FF;color:var(--primary);outline:none;transition:0.2s;
}
.form-group select:focus, .form-group input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(58,28,98,0.08);}

.details-box{
  background:linear-gradient(135deg,#F8F0FF,#FFF5F8);border:1px solid #E9D5FF;
  border-radius:16px;padding:14px 16px;margin:16px 0;display:none;
}
.details-box p{font-size:13px;font-weight:600;color:var(--primary);margin:7px 0;display:flex;justify-content:space-between;}
.details-box span{font-weight:800;}

.btn-submit{
  width:100%;padding:15px;background:linear-gradient(135deg,#3A1C62,#5B2C98);
  color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:800;
  cursor:pointer;box-shadow:0 8px 20px rgba(58,28,98,0.25);transition:0.15s;
}
.btn-submit:active{transform:scale(0.98);}
.btn-submit:disabled{background:#E2E8F0;color:#94A3B8;box-shadow:none;}
.btn-link{display:block;text-align:center;margin-top:14px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:rgba(255,255,255,0.96);backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;border-top:1px solid #F3E8FF;z-index:100;}
.nav-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#A8A0B5;font-size:10px;font-weight:600;gap:3px;}
.navItem.active .material-symbols-outlined{color:var(--pink);} .nav-item.active{color:var(--pink);font-weight:700;}
.nav-item .material-symbols-outlined{font-size:24px;}
</style>
</head>
<body>

<header class="app-header">
  <div class="gda-logo-container">
    <div class="gda-logo-icon"><span class="material-symbols-outlined">shield_with_heart</span></div>
    <div class="gda-logo-text"><h1>GDA</h1><p>Finance Services</p></div>
  </div>
  <a href="customer-list.html" class="back-btn">← Back</a>
</header>

<div class="container">
  <div class="form-card">
    <div class="title">💰 Collect Daily EMI</div>

    <div class="form-group">
      <label>Select Target Customer</label>
      <select id="customerSelect"><option value="" disabled selected>-- Select Customer --</option></select>
    </div>

    <div class="form-group">
      <label>Collection Date</label>
      <input type="date" id="collectionDate">
    </div>

    <div class="form-group">
      <label>Amount to Collect (₹)</label>
      <input type="number" id="collectAmount" placeholder="Enter installment amount">
    </div>

    <div id="customerDetailsBox" class="details-box">
      <p>💰 EMI <span id="txtEmi">₹0</span></p>
      <p>📊 Remaining <span id="txtRemaining">₹0 / ₹0</span></p>
      <p>📅 Paid Days <span id="txtPaidDays">0 Days</span></p>
    </div>

    <button id="submitCollectionBtn" class="btn-submit">📥 Post Payment Record</button>
    <a href="customer-list.html" class="btn-link">📋 Return to Customer Directory</a>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item"><span class="material-symbols-outlined">home</span>Home</a>
  <a href="customer-list.html" class="nav-item"><span class="material-symbols-outlined">group</span>Customers</a>
  <a href="collection.html" class="nav-item active"><span class="material-symbols-outlined">paid</span>Collect</a>
  <a href="report.html" class="nav-item"><span class="material-symbols-outlined">analytics</span>Reports</a>
  <a href="#" id="logoutBtn" class="nav-item" style="color:#DC2626;"><span class="material-symbols-outlined">logout</span>Logout</a>
</nav>

<script type="module" src="collection.js"></script>
<script type="module">
  import { auth } from "./firebase.js";
  import { signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
  document.getElementById("logoutBtn")?.addEventListener('click', async (e)=>{
    e.preventDefault();
    if(confirm("Logout karna hai?")){ await signOut(auth); location.href="login.html"; }
  });
</script>
</body>
</html>
