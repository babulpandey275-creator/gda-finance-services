<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Edit Customer - GDA Finance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
    body { background:#F8FAFF; min-height:100vh; padding-bottom:20px; }
    
    .app-header {
      background: linear-gradient(135deg,#2A1742 0%,#3A1C62 50%,#4C2A7A 100%);
      padding: 18px 16px 20px;
      border-radius: 0 0 26px 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .gda-logo-container { display:flex; align-items:center; gap:13px; }
    .gda-logo-icon {
      width:52px; height:52px; border-radius:16px;
      background:linear-gradient(135deg,#E91E63,#FF5A8A);
      display:flex; justify-content:center; align-items:center;
      border:2px solid rgba(255,255,255,0.3);
    }
    .gda-logo-icon .material-symbols-outlined { font-size:28px; color:#fff; font-variation-settings:'FILL'1; }
    .gda-logo-text h1 { margin:0; font-size:27px; font-weight:800; color:#fff; }
    .gda-logo-text p { margin-top:3px; font-size:10.5px; font-weight:700; letter-spacing:3.2px; color:#FFC107; text-transform:uppercase; }
    .back-btn { background:rgba(255,255,255,0.14); color:#fff; padding:9px 14px; border-radius:12px; text-decoration:none; font-size:12px; border:1px solid rgba(255,255,255,0.18); }

    .container { padding:16px; max-width:600px; margin:0 auto; }
    .form-card {
      background:#fff; border-radius:24px; padding:20px;
      box-shadow:0 8px 30px rgba(0,0,0,0.05); border:1px solid #F1F5F9;
    }
    .form-card h2 { font-size:18px; font-weight:800; color:#0F172A; margin-bottom:18px; display:flex; align-items:center; gap:8px; }
    
    .form-group { margin-bottom:16px; }
    .form-group label { display:block; font-size:10px; font-weight:700; color:#64748B; text-transform:uppercase; letter-spacing:0.6px; margin-bottom:4px; }
    .form-group input, .form-group select, .form-group textarea {
      width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid #E2E8F0;
      font-size:14px; font-weight:500; background:#fff; color:#0F172A; outline:none; transition:0.2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color:#3A1C62; box-shadow:0 0 0 4px rgba(58,28,98,0.08);
    }
    .form-group textarea { resize:vertical; min-height:60px; }

    .photo-preview {
      display:flex; align-items:center; gap:16px; margin-bottom:16px; padding:12px; background:#F8FAFF; border-radius:12px;
    }
    .photo-preview img { width:70px; height:70px; border-radius:50%; object-fit:cover; border:2px solid #E9D5FF; background:#fff; }
    .photo-preview .info { font-size:12px; color:#64748B; }

    .btn-save {
      width:100%; padding:14px; background:linear-gradient(135deg,#3A1C62,#5B2C98);
      color:#fff; border:none; border-radius:14px; font-size:16px; font-weight:800;
      cursor:pointer; box-shadow:0 8px 20px rgba(58,28,98,0.25); transition:0.15s;
    }
    .btn-save:active { transform:scale(0.98); }
    .btn-save:disabled { background:#E2E8F0; color:#94A3B8; box-shadow:none; }

    .loading-text { text-align:center; padding:40px; color:#94A3B8; }
  </style>
</head>
<body>

<header class="app-header">
  <div class="gda-logo-container">
    <div class="gda-logo-icon"><span class="material-symbols-outlined">shield_with_heart</span></div>
    <div class="gda-logo-text"><h1>GDA</h1><p>Finance Services</p></div>
  </div>
  <a href="customer-list.html" class="back-btn">← Back</a>
</header>

<div class="container">
  <div class="form-card">
    <h2>✏️ Edit Customer</h2>
    
    <div id="loadingIndicator" class="loading-text">⏳ Loading customer data...</div>
    
    <form id="editForm" style="display:none;">
      <!-- Hidden ID -->
      <input type="hidden" id="customerId">
      
      <!-- Name -->
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="editName" placeholder="Enter full name" required>
      </div>

      <!-- Mobile -->
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="text" id="editMobile" placeholder="Enter mobile number" required>
      </div>

      <!-- Customer Code -->
      <div class="form-group">
        <label>Customer Code (ID)</label>
        <input type="text" id="editCode" placeholder="e.g. GDA0012">
      </div>

      <!-- Loan Date -->
      <div class="form-group">
        <label>Loan Date</label>
        <input type="date" id="editLoanDate">
      </div>

      <!-- Loan Amount & Duration & EMI -->
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="form-group">
          <label>Loan Amount (₹)</label>
          <input type="number" id="editLoanAmount" placeholder="e.g. 15000">
        </div>
        <div class="form-group">
          <label>Plan Duration (Days)</label>
          <input type="number" id="editDuration" placeholder="e.g. 60">
        </div>
      </div>
      
      <div class="form-group">
        <label>Daily EMI (₹)</label>
        <input type="number" id="editDailyEmi" placeholder="e.g. 300">
      </div>

      <!-- KYC Fields -->
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="form-group">
          <label>Aadhar Number</label>
          <input type="text" id="editAadhar" placeholder="Enter Aadhar number">
        </div>
        <div class="form-group">
          <label>PAN Card Number</label>
          <input type="text" id="editPan" placeholder="Enter PAN number">
        </div>
      </div>

      <div class="form-group">
        <label>Residential Address</label>
        <textarea id="editAddress" placeholder="Enter full address"></textarea>
      </div>

      <!-- Photo URL -->
      <div class="form-group">
        <label>Photo URL (Image Link)</label>
        <input type="text" id="editPhotoUrl" placeholder="https://example.com/photo.jpg">
      </div>

      <!-- Photo Preview -->
      <div class="photo-preview">
        <img id="previewImage" src="https://via.placeholder.com/70" alt="Preview">
        <div class="info">Photo Preview<br><small>(Enter URL above to change)</small></div>
      </div>

      <!-- Status -->
      <div class="form-group">
        <label>Account Status</label>
        <select id="editStatus">
          <option value="Active">Active</option>
          <option value="Settled">Settled</option>
          <option value="Closed">Closed</option>
        </select>
      </div>

      <!-- Save Button -->
      <button type="submit" class="btn-save" id="saveBtn">💾 Save Changes</button>
    </form>
  </div>
</div>

<script type="module">
  import { db, auth } from "./firebase.js";
  import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

  const ADMIN_PASSWORD = "GDA@2026";

  // DOM elements
  const loadingIndicator = document.getElementById('loadingIndicator');
  const form = document.getElementById('editForm');
  const customerIdInput = document.getElementById('customerId');
  const editName = document.getElementById('editName');
  const editMobile = document.getElementById('editMobile');
  const editCode = document.getElementById('editCode');
  const editLoanDate = document.getElementById('editLoanDate');
  const editLoanAmount = document.getElementById('editLoanAmount');
  const editDuration = document.getElementById('editDuration');
  const editDailyEmi = document.getElementById('editDailyEmi');
  const editAadhar = document.getElementById('editAadhar');
  const editPan = document.getElementById('editPan');
  const editAddress = document.getElementById('editAddress');
  const editPhotoUrl = document.getElementById('editPhotoUrl');
  const editStatus = document.getElementById('editStatus');
  const previewImage = document.getElementById('previewImage');
  const saveBtn = document.getElementById('saveBtn');

  // Get ID from URL
  const urlParams = new URLSearchParams(window.location.search);
  const customerId = urlParams.get('id');

  if (!customerId) {
    loadingIndicator.innerHTML = '❌ No Customer ID found. Please go back and try again.';
    throw new Error('Missing ID');
  }

  // Load customer data
  async function loadCustomer() {
    try {
      const docSnap = await getDoc(doc(db, "customers", customerId));
      if (!docSnap.exists()) {
        loadingIndicator.innerHTML = '❌ Customer not found in database.';
        return;
      }
      const data = docSnap.data();

      // Fill form
      customerIdInput.value = customerId;
      editName.value = data.name || '';
      editMobile.value = data.mobile || '';
      editCode.value = data.customerCode || '';
      editLoanDate.value = data.loanDate || '';
      editLoanAmount.value = data.loanAmount || '';
      editDuration.value = data.planDuration || data.duration || '';
      editDailyEmi.value = data.dailyEmi || data.emi || '';
      editAadhar.value = data.aadhar || data.aadhaar || '';
      editPan.value = data.pan || '';
      editAddress.value = data.address || '';
      editPhotoUrl.value = data.photoUrl || data.photo || '';
      editStatus.value = data.status || 'Active';

      // Update preview
      const photoUrl = data.photoUrl || data.photo || '';
      if (photoUrl && photoUrl.startsWith('http')) {
        previewImage.src = photoUrl;
      } else {
        previewImage.src = 'https://via.placeholder.com/70';
      }

      loadingIndicator.style.display = 'none';
      form.style.display = 'block';

    } catch (err) {
      loadingIndicator.innerHTML = `❌ Error loading data: ${err.message}`;
      console.error(err);
    }
  }

  // Real-time photo preview
  editPhotoUrl.addEventListener('input', (e) => {
    const url = e.target.value.trim();
    if (url && url.startsWith('http')) {
      previewImage.src = url;
    } else {
      previewImage.src = 'https://via.placeholder.com/70';
    }
  });

  // Handle Save
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    // Admin Password Check
    const pass = prompt("🔑 Enter Admin Password to save changes:");
    if (pass !== ADMIN_PASSWORD) {
      if (pass !== null) alert("❌ Wrong Password! Changes not saved.");
      return;
    }

    if (!confirm("Are you sure you want to update this customer?")) return;

    saveBtn.disabled = true;
    saveBtn.innerText = '⏳ Saving...';

    try {
      const updatedData = {
        name: editName.value.trim(),
        mobile: editMobile.value.trim(),
        customerCode: editCode.value.trim(),
        loanDate: editLoanDate.value,
        loanAmount: Number(editLoanAmount.value) || 0,
        planDuration: Number(editDuration.value) || 60,
        dailyEmi: Number(editDailyEmi.value) || 0,
        aadhar: editAadhar.value.trim(),
        pan: editPan.value.trim(),
        address: editAddress.value.trim(),
        photoUrl: editPhotoUrl.value.trim(),
        status: editStatus.value,
        updatedAt: new Date().toISOString()
      };

      const custRef = doc(db, "customers", customerId);
      await updateDoc(custRef, updatedData);

      alert("✅ Customer updated successfully!");
      window.location.href = `statement.html?id=${customerId}`;
    } catch (err) {
      alert("❌ Error updating: " + err.message);
      saveBtn.disabled = false;
      saveBtn.innerText = '💾 Save Changes';
    }
  });

  // Auth Check
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      location.href = "login.html";
    } else {
      loadCustomer();
    }
  });
</script>
</body>
</html>
